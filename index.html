<!DOCTYPE html>
<html>
<head>
    <title>guess number
      </title>
      <meta name="viewport" content="width=device-width,initial-scale=1.0">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
      
    </head>

    <body>
        <style>
            .guessnumberbox{
                
                width: 90%;
max-width: 900px;
min-height: 500px;
margin:40px;
            
                color: azure;
                text-align: center;
            
    
                background-image: radial-gradient(blue,pink);
            }
            .one{
                text-shadow: 3px 3px red;
            }
           
                
            
        </style>
        <div class="container">
          
<div class="guessnumberbox ">
    <h1 class=" one mt-2 ">Guss Number</h1><br><br>
    <input id="guessnumber">
    <br><br>
    <button class=" btn btn-outline-warning" onclick="check()">check</button>
   <br><br><p id="result">you are wrong/right</p>
    <p id="score">Score:10</p><br>
    </div>
    </div>



    <script>
var guessnumber=document.getElementById("guessnumber")
var result=document.getElementById("result")
var score=document.getElementById("score")
var randomNumber=Math.floor(Math.random()*10)+1
var totalscore=10
function check()
{
    var enternumber=guessnumber.value
    if(randomNumber==enternumber)
        {
            console.log("Right")
            result.textContent="Right"
            alert("you win")
        }
        else{
            totalscore=totalscore-1
            score.textContent="score:"+totalscore
            result.textContent="wrong"
        }
    
}

    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
